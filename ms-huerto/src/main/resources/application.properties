spring.application.name=ms-huerto
server.port=8082

# Base de datos MySQL propia de este microservicio. createDatabaseIfNotExist
# crea la base la primera vez, asi no hay que crearla a mano.
spring.datasource.url=jdbc:mysql://localhost:3306/huerto_cultivos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
