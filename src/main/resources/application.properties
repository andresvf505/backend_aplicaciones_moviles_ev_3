spring.application.name=ms-huerto-escolar
server.port=8080

# Una sola base de datos MySQL para todo el huerto (antes eran tres:
# huerto_usuarios, huerto_cultivos y huerto_actividades).
# createDatabaseIfNotExist crea la base la primera vez, asi no hay que crearla a mano.
spring.datasource.url=jdbc:mysql://localhost:3306/huerto_escolar?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
